<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Alfa · 我做情人也不行吗</title>
  <meta name="description" content="Alfa · 22/T/巨蟹/INTP">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500;600&family=Noto+Serif+SC:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #141216;
      --bg-elevated: #1c1a1f;
      --surface: #211f25;
      --text-primary: #ece7e2;
      --text-secondary: #a49c9c;
      --text-muted: #6b6363;
      --accent: #b87a7a;
      --accent-soft: rgba(184, 122, 122, 0.12);
      --accent-glow: rgba(184, 122, 122, 0.06);
      --border: rgba(255, 255, 255, 0.07);
      --border-strong: rgba(255, 255, 255, 0.12);
      --radius: 2px;
      --font-display: 'Cormorant Garamond', 'Noto Serif SC', serif;
      --font-sans: 'Inter', 'Noto Serif SC', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text-primary);
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    /* ===== 背景：极简、必要的光 ===== */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse 80% 60% at 50% -10%, var(--accent-glow) 0%, transparent 60%),
        radial-gradient(ellipse 40% 40% at 90% 80%, rgba(184, 122, 122, 0.04) 0%, transparent 70%);
    }
    /* 极细的垂直基准线，呼应"比例优先" */
    body::after {
      content: '';
      position: fixed;
      top: 0; bottom: 0;
      left: 50%;
      width: 1px;
      background: linear-gradient(180deg, transparent 0%, var(--border) 18%, var(--border) 82%, transparent 100%);
      z-index: 0;
      pointer-events: none;
      opacity: 0.5;
    }

    .page {
      position: relative;
      z-index: 1;
      max-width: 640px;
      margin: 0 auto;
      padding: 0 28px;
    }

    /* ===== 封面 ===== */
    .hero {
      min-height: 88vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 100px 0 80px;
    }

    .hero-meta {
      font-family: var(--font-sans);
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 40px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .hero-meta .rule {
      width: 32px;
      height: 1px;
      background: var(--accent);
      opacity: 0.6;
    }

    .hero-name {
      font-family: var(--font-display);
      font-size: clamp(4.2rem, 16vw, 7rem);
      font-weight: 500;
      line-height: 0.9;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      margin-bottom: 28px;
    }
    .hero-name em {
      font-style: italic;
      color: var(--accent);
    }

    .hero-vitals {
      display: flex;
      gap: 20px;
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin-bottom: 56px;
    }
    .hero-vitals span {
      position: relative;
      padding-right: 20px;
    }
    .hero-vitals span:not(:last-child)::after {
      content: '';
      position: absolute;
      right: 0; top: 50%;
      transform: translateY(-50%);
      width: 1px; height: 10px;
      background: var(--border-strong);
    }

    .hero-thesis {
      font-family: var(--font-display);
      font-size: clamp(1.15rem, 3.2vw, 1.45rem);
      font-style: italic;
      font-weight: 400;
      line-height: 1.75;
      color: var(--text-secondary);
      max-width: 480px;
      padding-left: 20px;
      border-left: 1px solid var(--accent);
    }
    .hero-thesis strong {
      font-weight: 500;
      color: var(--text-primary);
      font-style: normal;
    }

    /* ===== 风格展示 ===== */
    .section {
      padding: 72px 0;
      border-top: 1px solid var(--border);
    }
    .section-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 36px;
    }
    .section-head h2 {
      font-family: var(--font-display);
      font-size: 1.1rem;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--text-primary);
    }
    .section-head .count {
      font-size: 10px;
      letter-spacing: 0.2em;
      color: var(--text-muted);
    }

    .style-list {
      display: flex;
      flex-direction: column;
      gap: 0;
    }
    .style-row {
      display: flex;
      align-items: baseline;
      gap: 18px;
      padding: 18px 0;
      border-bottom: 1px solid var(--border);
      transition: border-color 0.3s ease;
    }
    .style-row:last-child { border-bottom: none; }
    .style-row:hover { border-color: var(--border-strong); }

    .style-index {
      font-family: var(--font-display);
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--accent);
      min-width: 22px;
      font-style: italic;
    }
    .style-text {
      font-family: var(--font-display);
      font-size: 1.05rem;
      line-height: 1.7;
      color: var(--text-secondary);
      letter-spacing: 0.03em;
    }
    .style-text em {
      font-style: normal;
      color: var(--text-primary);
    }

    /* 声明句 */
    .declaration {
      margin-top: 20px;
      padding: 26px 28px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-left: 2px solid var(--accent);
      font-family: var(--font-display);
      font-size: 1.05rem;
      font-style: italic;
      color: var(--text-secondary);
      line-height: 1.9;
    }
    .declaration strong {
      font-style: normal;
      font-weight: 500;
      color: var(--text-primary);
    }

    /* ===== 跳转索引 ===== */
    .index-section {
      padding: 72px 0 100px;
      border-top: 1px solid var(--border);
    }

    .index-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      background: var(--border);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .index-card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 180px;
      padding: 26px 22px;
      background: var(--bg-elevated);
      text-decoration: none;
      color: var(--text-primary);
      position: relative;
      transition: background 0.35s ease;
    }
    .index-card:hover { background: var(--surface); }

    .index-card .card-label {
      font-size: 9px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 18px;
    }
    .index-card .card-title {
      font-family: var(--font-display);
      font-size: 1.3rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      color: var(--text-primary);
      margin-bottom: 6px;
    }
    .index-card .card-sub {
      font-size: 10px;
      letter-spacing: 0.1em;
      color: var(--text-muted);
    }
    .index-card .card-arrow {
      position: absolute;
      top: 22px; right: 20px;
      font-size: 14px;
      color: var(--text-muted);
      opacity: 0.35;
      transition: opacity 0.3s ease, color 0.3s ease, transform 0.3s ease;
    }
    .index-card:hover .card-arrow {
      opacity: 1;
      color: var(--accent);
      transform: translate(2px, -2px);
    }
    /* 底部一条极细的强调线，hover 时延展 */
    .index-card::after {
      content: '';
      position: absolute;
      bottom: 0; left: 22px; right: 22px;
      height: 1px;
      background: var(--accent);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .index-card:hover::after { transform: scaleX(1); }

    /* ===== 页脚 ===== */
    .footer {
      padding: 32px 0 48px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 9px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .footer .dot {
      width: 4px; height: 4px;
      border-radius: 50%;
      background: var(--accent);
      opacity: 0.6;
    }

    /* ===== 响应式 ===== */
    @media (max-width: 560px) {
      .page { padding: 0 20px; }
      .hero { min-height: 82vh; padding: 80px 0 60px; }
      .hero-name { margin-bottom: 22px; }
      .hero-vitals { flex-wrap: wrap; gap: 10px 0; margin-bottom: 44px; }
      .hero-vitals span { padding-right: 16px; }
      .hero-vitals span:not(:last-child)::after { display: none; }
      .hero-thesis { padding-left: 16px; font-size: 1rem; }

      .section { padding: 56px 0; }
      .style-row { gap: 14px; padding: 15px 0; }
      .style-text { font-size: 0.95rem; }

      .index-grid { grid-template-columns: 1fr; }
      .index-card {
        flex-direction: row;
        align-items: center;
        min-height: auto;
        padding: 22px 20px;
        gap: 16px;
      }
      .index-card .card-label { display: none; }
      .index-card .card-title { font-size: 1.1rem; margin-bottom: 0; }
      .index-card .card-sub { margin-left: auto; }
      .index-card .card-arrow { position: static; margin-left: 8px; opacity: 0.6; }
      .index-card::after { left: 20px; right: 20px; }

      body::after { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>

  <div class="page">

    <!-- ==================== 封面 ==================== -->
    <header class="hero">
      <div class="hero-meta">
        <span class="rule"></span>
        <span>PROFILE / 01</span>
      </div>

      <h1 class="hero-name">Alfa<em>.</em></h1>

      <div class="hero-vitals">
        <span>22</span>
        <span>T</span>
        <span>巨蟹</span>
        <span>INTP</span>
      </div>

      <p class="hero-thesis">
        <strong>“所以呢，</strong><br>
        我做情人也不行吗？”
      </p>
    </header>

    <!-- ==================== 风格 ==================== -->
    <section class="section">
      <div class="section-head">
        <h2>STYLE</h2>
        <span class="count">04</span>
      </div>

      <div class="style-list">
        <div class="style-row">
          <span class="style-index">i.</span>
          <span class="style-text"><em>浪荡调情</em>　缠绵痴爱　厚颜无耻</span>
        </div>
        <div class="style-row">
          <span class="style-index">ii.</span>
          <span class="style-text">日常纯爱　<em>中剖低恋</em>　诱哄安抚</span>
        </div>
        <div class="style-row">
          <span class="style-index">iii.</span>
          <span class="style-text">偶尔毒舌，<em>没错是在挑衅你</em></span>
        </div>
        <div class="style-row">
          <span class="style-index">iv.</span>
          <span class="style-text">更加入小三做派，<em>背德之情</em></span>
        </div>
      </div>

      <div class="declaration">
        不要纯洁，不要正确。<br>
        <strong>要你明知道不该，还是过来。</strong>
      </div>
    </section>

    <!-- ==================== 索引 ==================== -->
    <section class="index-section">
      <div class="section-head">
        <h2>INDEX</h2>
        <span class="count">03</span>
      </div>

      <div class="index-grid">
        <a class="index-card" href="https://www.kdocs.cn/l/cge8p6Fpdt00" target="_blank" rel="noopener noreferrer">
          <span class="card-arrow">↗</span>
          <span class="card-label">Doc 01</span>
          <div>
            <div class="card-title">须知</div>
            <div class="card-sub">TERMS</div>
          </div>
        </a>
        <a class="index-card" href="https://www.kdocs.cn/l/cbeTYvJgO4iC" target="_blank" rel="noopener noreferrer">
          <span class="card-arrow">↗</span>
          <span class="card-label">Doc 02</span>
          <div>
            <div class="card-title">话术</div>
            <div class="card-sub">SCRIPTS</div>
          </div>
        </a>
        <a class="index-card" href="https://www.kdocs.cn/l/cuT38cJ4lPo1" target="_blank" rel="noopener noreferrer">
          <span class="card-arrow">↗</span>
          <span class="card-label">Doc 03</span>
          <div>
            <div class="card-title">板评</div>
            <div class="card-sub">REVIEWS</div>
          </div>
        </a>
      </div>
    </section>

    <footer class="footer">
      <span>ALFA · 22/T · INTP</span>
      <span class="dot"></span>
      <span>必要的美丽</span>
    </footer>

  </div>

</body>
</html>
